name: maglif-wandb-sweep

resources:
  cpus: 4
  accelerators: T4:1
  use_spot: false
  region: us-central1

num_nodes: 1

setup: |
  git clone -b development https://github.com/Zenithon-AI-Development/GAOT.git /tmp/gaot
  cd /tmp/gaot
  conda activate gaot_env
  export WANDB_API_KEY=2936a88d0916e4ae7a5ee81bd02146e1c9967367
  pip install -q toml
  
run: |
  cd /tmp/gaot
  conda activate gaot_env
  export WANDB_API_KEY=2936a88d0916e4ae7a5ee81bd02146e1c9967367
  mkdir -p /home/shared_info
  echo "Syncing only maglif dataset from GCS bucket..."
  gsutil -m rsync -r gs://data-share-bucket-zenithon/new_processed_maglif /home/shared_info/new_processed_maglif
  echo "Dataset sync completed, starting training..."
  wandb agent ${SWEEP_ID} --count 20 -- --config config/examples/time_dep/maglif.json
  if [ -d .ckpt ] || [ -d .loss ] || [ -d .results ] || [ -d .database ]; then
    gsutil -m cp -r .ckpt .loss .results .database gs://data-share-bucket-zenithon/gaot_sweep_results/ 2>&1 || echo "Results sync to GCS completed"
  fi

